<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩单配色</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-2xl w-full">
        <h1 class="text-2xl font-bold text-center mb-6">成绩单</h1>
        <table class="w-full table-auto border-collapse">
            <thead>
                <tr class="bg-gray-200">
                    <th class="px-4 py-2">题目编号</th>
                    <th class="px-4 py-2">实际得分</th>
                    <th class="px-4 py-2">总分</th>
                    <th class="px-4 py-2">得分百分比</th>
                </tr>
            </thead>
            <tbody id="gradeTable">
                <!-- Sample data will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Sample data: [question number, actual score, total score]
        const grades = [
            [1, 10, 10],
            [2, 9, 10],
            [3, 7, 10],
            [4, 5, 10],
            [5, 3, 10],
            [6, 1, 10],
            [7, 0, 10]
        ];

        function getColor(percentage) {
            if (percentage === 100) return 'bg-gradient-to-r from-[#4CAF50] to-[#81C784]';
            if (percentage > 80) return 'bg-gradient-to-r from-[#81C784] to-[#A5D6A7]';
            if (percentage > 60) return 'bg-gradient-to-r from-[#FFCA28] to-[#FFE082]';
            if (percentage > 40) return 'bg-gradient-to-r from-[#FF8A65] to-[#FFAB91]';
            if (percentage > 20) return 'bg-gradient-to-r from-[#FF6F61] to-[#FF9A8B]';
            if (percentage > 0) return 'bg-gradient-to-r from-[#D32F2F] to-[#E57373]';
            return 'bg-[#B71C1C]';
        }

        const tableBody = document.getElementById('gradeTable');
        grades.forEach(([question, actual, total]) => {
            const percentage = (actual / total) * 100;
            const colorClass = getColor(percentage);
            const row = `
                <tr class="border-b">
                    <td class="px-4 py-2 text-center">${question}</td>
                    <td class="px-4 py-2 text-center">${actual}</td>
                    <td class="px-4 py-2 text-center">${total}</td>
                    <td class="px-4 py-2 text-center ${colorClass} text-white">${percentage.toFixed(1)}%</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    </script>
</body>
</html>
